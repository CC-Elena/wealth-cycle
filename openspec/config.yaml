schema: spec-driven

context: |
  项目定位：全周期个人财务管理 Web / H5 应用
  核心目标：通过收入、预算、消费、库存、储蓄、预购决策形成财务闭环。
  
  【技术栈与架构】
  - 平台：跨平台支持移动端为主的 Web / H5 (Android / iOS)
  - 前端：TypeScript, React, Vite
  - 后端：Node.js
  - 存储：终端保存完整数据（本地 SQLCipher 等效加密数据库），云端只保留脱敏和统计级数据。
  - 设计风格：黑白灰极简风格，Dashboard 首屏，悬浮记账按钮。
  
  【领域术语】
  - 净资产 (Net Worth)：账户资产、储蓄、应收应付与必要负债的综合快照。
  - 可支配资金：预扣账单、预算补足和应急资金后可自由分配的余额。
  - 预算块：绑定大分类的周期性资金池（支持到期结转或积累）。
  - 储蓄：从各资金结余、划转沉淀出的长期保留资金。
  - 应急资金：与发薪周期绑定的特殊特殊预算（默认冻结状态）。
  - 库存：已购买物品（消耗品、耐用品）批次的系统集合。
  - 浪费清单：保质期内未用完的清单物品，将会影响后续预购评分。
  - 预购项：购买前处于冷静冻结期或系统级多维评分阶段的计划物品。
  
  【安全与合规约束】
  - 隐私优先：敏感信息和原始流水明细本地强加密留存，云端禁存不必要的完整明细商品和关联生活记录。
  - 最小云化：云端尽量只承担数据同步与聚合脱敏指标的保存功能。
  - 安全隔离：传输要求全站 HTTPS/TLS 加密，账号密钥、设备密钥和本地数据库密钥分层隔离。
  - 用户控制：必须支持随时导出本地数据和清除同步数据。

rules:
  proposal:
    - 文档结构必须包含 Intent（原因意图）、Scope（影响边界）和 Approach（方案方向）三个基准章节。
    - 涉及闭环特性的提案需说明本次设计对预算、储蓄或库存等其它财务环节的影响。
  design:
    - 面向技术落地回答"How"，需要说明技术方案、具体的数据模型或接口变更。
    - 对于存储变动，需特别声明数据存放在本地还是同步上云及其合规脱敏策略。
  tasks:
    - 落地实现必须被拆分为以列表 `- [ ]` 作为前缀形式的执行状态 Checkbox。
    - 建议按领域或组件分组（例如：前端/后台/数据模型或模块1/模块2），保持实现粒度适中。
  specs:
    - 需按照规范对特性分块列示：即划分为 ADDED Requirements、MODIFIED Requirements 和 REMOVED Requirements。
    - 每条业务要求规则须内嵌关联测试场景，并且采用标准 BDD 语法描述（包含 GIVEN / WHEN / THEN / AND）。
  global:
    - 所有 OpenSpec 文档（Proposal, Design, Tasks, Specs）必须使用中文编写，包括标题和正文。

